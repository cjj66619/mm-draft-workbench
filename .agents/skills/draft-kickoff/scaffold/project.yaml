# 项目元数据（机器可读；人看 README.md）
name: "{{PROJECT}}"
title: "{{TITLE}}"
contest: "{{CONTEST}}"
language: zh
created: "{{DATE}}"
generator:
  name: mm-draft-workbench
  version: "{{GEN_VERSION}}"
  platform: "{{GEN_PLATFORM}}"
targets:
  python: ">=3.10"
  os: [windows, linux, macos]
entrypoints:
  doctor: python doctor.py
  reproduce: python run_all.py
  figures_only: python run_all.py figures
  paper_check: python run_all.py paper
paper:
  format: markdown             # 一章一个 .md，LaTeX 公式，@fig:/@tbl:/@eq: 交叉引用
  meta: paper/paper.yaml       # 题目 / 关键词 / 章节顺序
  sections: paper/sections
  abstract: paper/sections/00_abstract.md
  check_report: reports/PAPER_CHECK.md
figures:
  layout: folder               # 一图一文件夹
  index: figures/README.md
  review: figures/FIGURE_REVIEW.md
